<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Arredondado do Ícone Executável -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Anel Brilhante Externo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>

  <!-- Halter Simbólico (Workout Dumbbell Icon) -->
  <g transform="translate(256, 230)">
    <!-- Barra Central -->
    <rect x="-110" y="-12" width="220" height="24" rx="12" fill="#e0e0e0"/>
    
    <!-- Anilhas Esquerdas -->
    <rect x="-140" y="-65" width="32" height="130" rx="12" fill="url(#ringGrad)"/>
    <rect x="-170" y="-85" width="28" height="170" rx="14" fill="#1e88e5"/>
    <rect x="-185" y="-55" width="14" height="110" rx="7" fill="#00d2ff"/>

    <!-- Anilhas Direitas -->
    <rect x="108" y="-65" width="32" height="130" rx="12" fill="url(#ringGrad)"/>
    <rect x="142" y="-85" width="28" height="170" rx="14" fill="#1e88e5"/>
    <rect x="171" y="-55" width="14" height="110" rx="7" fill="#00d2ff"/>
    
    <!-- Presilhas de Segurança -->
    <circle cx="-100" cy="0" r="16" fill="#ffffff"/>
    <circle cx="100" cy="0" r="16" fill="#ffffff"/>
  </g>

  <!-- Texto JTECH FIT no Ícone Executável -->
  <text x="256" y="420" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    JTECH <tspan fill="#00d2ff">FIT</tspan>
  </text>
</svg>
